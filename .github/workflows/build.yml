name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the ROM to a release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nasm assembles GB.COM (apps/gb) at image-build time — a required
      # build prereq now that no app binaries are committed.
      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake nasm

      # WLA-DX — the SNES assembler/linker. Pinned to match the version the
      # project is developed against (local: v10.7a). If a future WLA-DX ever
      # rejects the sources, pin this to the matching tag.
      - name: Build WLA-DX
        run: |
          git clone --depth 1 --branch v10.7 https://github.com/vhelin/wla-dx.git
          cmake -S wla-dx -B wla-dx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build wla-dx/build -j"$(nproc)"
          echo "PVBIN=$(dirname "$(find "$PWD/wla-dx/build" -name wla-65816 -type f | head -1)")" >> "$GITHUB_ENV"

      # runpc — the C reference 8086 core: the boot-smoke oracle below, and
      # the machine the DOS builds compile their own apps on (TP3 / Small-C
      # run inside it). (IO.SYS is prebuilt: msdos/msdos.img is a committed
      # free floppy, so the public build no longer links it here — see
      # `make io` for the dev path.)
      - name: Build core-c (runpc)
        run: make -C core-c runpc

      # Turbo Pascal 3.01A — the compiler the DOS builds drive inside runpc
      # to build the app .COMs (no app binaries are committed). Fetched by
      # apps/fetch_tp3.py with a pinned sha256 (Borland retains all rights,
      # so it is fetched, never committed — same stance as ELKS/FreeDOS);
      # cache it so CI does not hit archive.org every run.
      - name: Cache the fetched TP3 compiler
        uses: actions/cache@v4
        with:
          path: |
            apps/cache/TURBO.COM
            apps/cache/TURBO.MSG
          key: tp3-${{ hashFiles('apps/fetch_tp3.py') }}

      # Open Watcom v2 — the cross-compiler that builds VI.EXE (levee)
      # at image-build time (apps/vi/fetch_watcom.py: pinned sha256,
      # ~151 MB download on a cold cache, unpacks only the Linux host
      # bins + headers + 16-bit libs, ~60 MB). Cache the extracted
      # toolchain so CI refetches only when the pin moves.
      - name: Cache the fetched Open Watcom toolchain
        uses: actions/cache@v4
        with:
          path: apps/cache/watcom
          key: watcom-${{ runner.os }}-${{ hashFiles('apps/vi/fetch_watcom.py') }}

      # The public ROM: MS-DOS 2.0 + a free-only C:. Compiles every app
      # binary from source first (TP3 + Small-C inside runpc, Open
      # Watcom for VI.EXE, nasm for GB.COM), then packs the free C: —
      # nothing copyrighted ships.
      - name: Build the public ROM (msdos.sfc)
        run: make -C snes PVBIN="$PVBIN" msdos

      # The BIGMEM experiment: same MS-DOS + free C:, guest RAM grown to
      # 172 KB by spending the cartridge SRAM (so no B: drive). Reuses the
      # app binaries the msdos build just compiled.
      - name: Build the BIGMEM ROM (msdos_big.sfc)
        run: make -C snes PVBIN="$PVBIN" msdos_big

      # The SA-1 variant: the same MS-DOS + free C: on a 300 KB machine
      # (108 KB WRAM + 192 KB of SA-1 BW-RAM), and it keeps B: on the
      # fourth BW-RAM bank. The SA-1 coprocessor is never released from
      # reset — the board is used purely as a RAM expander. Needs an
      # SA-1-capable cart or emulator to run.
      - name: Build the SA-1 ROM (msdos_sa1.sfc)
        run: make -C snes PVBIN="$PVBIN" msdos_sa1

      # The ELKS ROM: Linux (well, the Embeddable Linux Kernel Subset) on a
      # SNES. The kernel + ROMFS images are fetched from the official ELKS
      # v0.9.1 release by test/fetch_elks.sh (GPL software - fetched at build
      # time, never committed here; unmodified upstream binaries, source at
      # github.com/ghaerr/elks). Bundling them in the ROM alongside our MIT
      # emulator is aggregation, with source available upstream.
      - name: Build the ELKS ROM (elks.sfc)
        run: make -C snes PVBIN="$PVBIN" elks

      # The FreeDOS ROM: FreeDOS 1.3 on the 172 KB BIGMEM machine. Kernel +
      # FreeCOM are pulled from the official FreeDOS 1.3 Floppy Edition by
      # freedos/mkfreedos.py (GPL - fetched at build time with a pinned
      # sha256, never committed; source at github.com/FDOS). Same
      # aggregation stance as the ELKS ROM.
      - name: Build the FreeDOS ROM (freedos.sfc)
        run: make -C snes PVBIN="$PVBIN" freedos

      # The whole regression surface in one step: parity + every host
      # smoke (boot, CGA6, VIEW, TED, JAVA, Small-C, JAVAC-on-machine,
      # ELKS, FreeDOS — all on runpc, the C reference core) against the
      # ROMs built above. The Mesen legs and parity self-SKIP with one
      # loud line: there is no Mesen here, so the 65816 core is never
      # executed in CI — that half of the suite is the local half.
      - name: Run the test suite (make test)
        run: make test PVBIN="$PVBIN"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: msdos-sfc
          path: snes/build/msdos.sfc

      - name: Upload BIGMEM ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: msdos-big-sfc
          path: snes/build/msdos_big.sfc

      - name: Upload SA-1 ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: msdos-sa1-sfc
          path: snes/build/msdos_sa1.sfc

      - name: Upload FreeDOS ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: freedos-sfc
          path: snes/build/freedos.sfc

      - name: Upload ELKS ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: elks-sfc
          path: snes/build/elks.sfc

      # On a v* tag: publish a release with the ROM. GitHub also attaches the
      # "Source code" archives automatically. (The git history has been
      # scrubbed of copyrighted material — disks/ and gbdos/ — so tags are
      # safe to cut.)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snes/build/msdos.sfc
            snes/build/msdos_big.sfc
            snes/build/msdos_sa1.sfc
            snes/build/freedos.sfc
            snes/build/elks.sfc
          generate_release_notes: true
          body: |
            **snes86** — MS-DOS 2.0, FreeDOS and Linux on a stock, unmodified SNES.

            - `msdos.sfc` — the flashable public ROM (free software only).
            - `msdos_big.sfc` — the BIGMEM experiment: 172 KB of guest RAM
              (cartridge SRAM spent as memory, so no B: drive), same free C:.
            - `msdos_sa1.sfc` — the SA-1 board used purely as a RAM expander
              (its coprocessor is never started): a 300 KB guest that still
              has B:, same free C:. Needs an SA-1-capable cartridge or
              emulator — most flash carts, FXPak included, will not run it.
            - `freedos.sfc` — FreeDOS 1.3 booting to FreeCOM on the 172 KB
              BIGMEM machine; bundles the unmodified official FreeDOS kernel
              + FreeCOM (GPL — source at https://github.com/FDOS).
            - `elks.sfc` — ELKS 0.9.1 (Linux for the 8086) booting to a root
              shell; bundles the unmodified official ELKS release images
              (GPL — source at https://github.com/ghaerr/elks).
            - Full source is in the auto-generated "Source code" archives below.

            See the [README](https://github.com/rgsilva/snes86#readme) and
            `docs/` for what it is and how to build it.
