name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the ROM to a release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      # WLA-DX — the SNES assembler/linker. Pinned to match the version the
      # project is developed against (local: v10.7a). If a future WLA-DX ever
      # rejects the sources, pin this to the matching tag.
      - name: Build WLA-DX
        run: |
          git clone --depth 1 --branch v10.7 https://github.com/vhelin/wla-dx.git
          cmake -S wla-dx -B wla-dx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build wla-dx/build -j"$(nproc)"
          echo "PVBIN=$(dirname "$(find "$PWD/wla-dx/build" -name wla-65816 -type f | head -1)")" >> "$GITHUB_ENV"

      # runpc — the C reference 8086 core, used as the boot-smoke oracle below.
      # (IO.SYS is prebuilt: msdos/msdos.img is a committed free floppy, so the
      # public build no longer links it here — see `make io` for the dev path.)
      - name: Build core-c (runpc)
        run: make -C core-c runpc

      # The public ROM: MS-DOS 2.0 + a free-only C:. Builds from committed
      # files only (no copyrighted software).
      - name: Build the public ROM (msdos.sfc)
        run: make -C snes PVBIN="$PVBIN" msdos

      # End-to-end smoke: boot the built MS-DOS floppy (A:) + free C: on runpc.
      - name: Smoke test — boot MS-DOS
        run: |
          printf '\r\r\r' | core-c/build/runpc -c -l 200000000 \
            -m 108 -d snes/build/hd_free.img msdos/msdos.img | tee boot.log
          grep -q "MS-DOS version 2.00" boot.log

      # End-to-end smoke: the M10p6 CGA mode-6 path. Run the test card from
      # the free C: and verify runpc's dump is true 640x200 with 1px stripes
      # and the white band (the SNES side is covered by test/t_cga6.lua).
      - name: Smoke test — CGA mode 6 (640x200)
        run: |
          printf '\r\rc:\rcd \\bench\rcga6tst\rx\r' | core-c/build/runpc -c -l 500000000 \
            -m 108 -d snes/build/hd_free.img -cga cga6.ppm msdos/msdos.img >/dev/null
          python3 -c 'd=open("cga6.ppm","rb").read().split(b"\n",3); w,h=map(int,d[1].split()); p=d[3]; assert (w,h)==(640,200),(w,h); assert all(p[x*3]==(255,0)[x%2] for x in range(8)); assert p[96*640*3]==255; print("CGA6 OK")'

      # End-to-end smoke: VIEW.COM (our TP3 BMP viewer, a committed binary)
      # decodes the generated test card and paints CGA mode 6 on runpc.
      - name: Smoke test — VIEW.COM paints the test card
        run: |
          printf '\r\rc:\rcd \\pics\rview card.bmp\rx\r' | core-c/build/runpc -c -l 3000000000 \
            -m 108 -d snes/build/hd_free.img -cga view.ppm msdos/msdos.img >/dev/null
          python3 -c 'd=open("view.ppm","rb").read().split(b"\n",3); w,h=map(int,d[1].split()); p=d[3]; assert (w,h)==(640,200); r=lambda y:[p[(y*640+x)*3] for x in range(0,640,7)]; assert max(r(5))==0; assert 0 in r(100) and 255 in r(100); print("VIEW OK")'

      # The ELKS ROM: Linux (well, the Embeddable Linux Kernel Subset) on a
      # SNES. The kernel + ROMFS images are fetched from the official ELKS
      # v0.9.1 release by test/fetch_elks.sh (GPL software - fetched at build
      # time, never committed here; unmodified upstream binaries, source at
      # github.com/ghaerr/elks). Bundling them in the ROM alongside our MIT
      # emulator is aggregation, with source available upstream.
      - name: Build the ELKS ROM (elks.sfc)
        run: make -C snes PVBIN="$PVBIN" elks

      # End-to-end smoke: boot ELKS from the ROM images on runpc, expect the
      # login prompt (or a direct root shell on no-getty root filesystems).
      - name: Smoke test — boot ELKS
        run: |
          printf '' | core-c/build/runpc -m 172 -l 100000000 \
            -rom snes/build/elks_rom.bin@e000 \
            -rom snes/build/elks_romfs.bin@8000 \
            -entry e000:0014 | tee elks.log
          grep -qE "login:|# " elks.log

      # The FreeDOS ROM: FreeDOS 1.3 on the 172 KB BIGMEM machine. Kernel +
      # FreeCOM are pulled from the official FreeDOS 1.3 Floppy Edition by
      # freedos/mkfreedos.py (GPL - fetched at build time with a pinned
      # sha256, never committed; source at github.com/FDOS). Same
      # aggregation stance as the ELKS ROM.
      - name: Build the FreeDOS ROM (freedos.sfc)
        run: make -C snes PVBIN="$PVBIN" freedos

      # End-to-end smoke: boot FreeDOS on runpc, expect our AUTOEXEC banner
      # (which only prints after kernel + FreeCOM + the C: mount all work).
      - name: Smoke test — boot FreeDOS
        run: |
          printf '' | core-c/build/runpc -m 172 -l 100000000 \
            -d snes/build/hd_free.img snes/build/freedos_a.img | tee fdos.log
          grep -q "FreeDOS on a SNES" fdos.log

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: msdos-sfc
          path: snes/build/msdos.sfc

      - name: Upload FreeDOS ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: freedos-sfc
          path: snes/build/freedos.sfc

      - name: Upload ELKS ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: elks-sfc
          path: snes/build/elks.sfc

      # On a v* tag: publish a release with the ROM. GitHub also attaches the
      # "Source code" archives automatically. (The git history has been
      # scrubbed of copyrighted material — disks/ and gbdos/ — so tags are
      # safe to cut.)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            snes/build/msdos.sfc
            snes/build/freedos.sfc
            snes/build/elks.sfc
          generate_release_notes: true
          body: |
            **snes86** — MS-DOS 2.0, FreeDOS and Linux on a stock, unmodified SNES.

            - `msdos.sfc` — the flashable public ROM (free software only).
            - `freedos.sfc` — FreeDOS 1.3 booting to FreeCOM on the 172 KB
              BIGMEM machine; bundles the unmodified official FreeDOS kernel
              + FreeCOM (GPL — source at https://github.com/FDOS).
            - `elks.sfc` — ELKS 0.9.1 (Linux for the 8086) booting to a root
              shell; bundles the unmodified official ELKS release images
              (GPL — source at https://github.com/ghaerr/elks).
            - Full source is in the auto-generated "Source code" archives below.

            See the [README](https://github.com/rgsilva/snes86#readme) and
            `docs/` for what it is and how to build it.
